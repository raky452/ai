name: Build Windows Assistant

on:
  push:
    branches: [main, technoforesight-windows]
    paths: ['technoforesight/windows-assistant/**', '.github/workflows/windows-assistant.yml']
    tags: ['win-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release (tag win-v<version>)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: technoforesight/windows-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build app and installer
        run: ./build.ps1
      - name: Render UI preview screenshots
        run: |
          python -m pip install pillow
          python tools/ui_preview.py dist/preview
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: technoforesight/windows-assistant/dist/preview/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: TechnoForesightAssistant-windows
          path: |
            technoforesight/windows-assistant/dist/*.exe
            technoforesight/windows-assistant/dist/*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/win-v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "import tf_assistant; print(tf_assistant.__version__)").Trim()
          $tag = "win-v$version"
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object { $_.FullName }
          gh release create $tag $files --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest `
            --title "TechnoForesight Assistant for Windows v$version" `
            --notes "Offline AI command bar for Windows. Download the Setup .exe, run it, then press Alt+Space. Needs Ollama (free) for the AI: https://ollama.com/download/windows. Full guide: https://technoforesight.in/assistant"
