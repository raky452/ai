[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "technoforesight-assistant"
version = "0.1.0"
description = "Offline AI command bar for Linux desktops, powered by a local model via Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - TechnoForesight" }
# GTK comes from the system (python3-gi + gir1.2-gtk-4.0), not from pip.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
technoforesight-assistant = "technoforesight_assistant.__main__:main"

[tool.setuptools]
packages = ["technoforesight_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
